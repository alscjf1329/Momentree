services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY}
    container_name: momentree
    ports:
      - "3001:3000"
    volumes:
      # 호스트·컨테이너 경로를 .env의 DATA_DIR과 같게 — 하드코딩하면 DATA_DIR을 바꿔도 /data/momentree가 계속 생기고 데이터는 컨테이너 안에 쌓임
      - ${DATA_DIR:-/data/momentree}:${DATA_DIR:-/data/momentree}
    environment:
      - NODE_ENV=production
      # 서버에 IPv6 경로가 없어 외부(텔레그램·Gmail) 연결이 ETIMEDOUT 나던 문제 — IPv4 주소를 먼저 쓴다
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file:
      - .env
    restart: unless-stopped
