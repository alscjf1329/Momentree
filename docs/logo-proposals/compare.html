<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마당 로고 시안 비교 (MOM-18)</title>
<style>
:root{--ink:#111;--sub:#6B6B6B;--line:#EBEBEB}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 48px;background:#fff;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
h1,h2{font-family:"Noto Serif KR",Georgia,serif;font-weight:400;letter-spacing:.04em}
h1{font-size:22px;margin:0 0 4px}.lead{color:var(--sub);margin:0 0 24px;font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));max-width:1100px;margin:0 auto}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
h2{font-size:18px;margin:0 0 4px}.desc{color:var(--sub);font-size:13px;margin:0 0 14px}
.row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dark{background:#111;border-radius:8px;padding:12px}
.light{background:#fff;border:1px solid var(--line)}
img{display:block;max-width:100%;height:auto}
.wm{width:100%;max-width:300px}
small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
</style></head><body>
<h1>마당 로고 시안</h1><p class="lead">사람이 모이는 열린 자리. 마음에 드는 안을 고르면 앱 아이콘을 교체합니다.</p>
<div class="grid">
<section class="card"><h2>A 열린 문</h2><p class="desc">둥근 아치 안의 빈 자리, 모이는 곳으로 들어서는 입구.</p>
<div class="row"><div><img src="icon-a.svg" width="32" height="32" alt=""><small>32</small></div><div><img src="icon-a.svg" width="64" height="64" alt=""><small>64</small></div><div><img src="icon-a.svg" width="192" height="192" alt=""><small>192</small></div></div>
<div class="row dark"><img src="icon-a.svg" width="32" height="32" alt=""><img src="icon-a.svg" width="64" height="64" alt=""><img src="icon-a.svg" width="192" height="192" alt=""></div>
<div class="dark light"><img class="wm" src="wordmark-a.svg" alt="마당 A madang"></div></section>
<section class="card"><h2>B 둘러앉은 원 <span style="color:#C2255C;font-size:13px">선택: B(흰 배경)</span></h2><p class="desc">원형 마당에 점들이 둘러앉은 모양. 사람 수는 정하지 않은 추상 점.</p>
<div class="row"><div><img src="icon-b.svg" width="32" height="32" alt=""><small>32</small></div><div><img src="icon-b.svg" width="64" height="64" alt=""><small>64</small></div><div><img src="icon-b.svg" width="192" height="192" alt=""><small>192</small></div></div>
<div class="row dark"><img src="icon-b.svg" width="32" height="32" alt=""><img src="icon-b.svg" width="64" height="64" alt=""><img src="icon-b.svg" width="192" height="192" alt=""></div>
<div class="dark light"><img class="wm" src="wordmark-b.svg" alt="마당 B madang"></div></section>
<section class="card"><h2>C 한글 마</h2><p class="desc">ㅁ(네모 마당)과 ㅏ로 만든 한글 모노그램.</p>
<div class="row"><div><img src="icon-c.svg" width="32" height="32" alt=""><small>32</small></div><div><img src="icon-c.svg" width="64" height="64" alt=""><small>64</small></div><div><img src="icon-c.svg" width="192" height="192" alt=""><small>192</small></div></div>
<div class="row dark"><img src="icon-c.svg" width="32" height="32" alt=""><img src="icon-c.svg" width="64" height="64" alt=""><img src="icon-c.svg" width="192" height="192" alt=""></div>
<div class="dark light"><img class="wm" src="wordmark-c.svg" alt="마당 C madang"></div></section>
</div></body></html>
